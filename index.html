<script>
// protecao contra clickjacking: nao corre dentro de iframes de outros sites
if(window.top !== window.self){ document.documentElement.innerHTML = ''; throw new Error('framed'); }

window.storage = {
  async get(key){
    const v = localStorage.getItem(key);
    return v === null ? null : { key, value: v, shared: false };
  },
  async set(key, value){
    localStorage.setItem(key, value);
    return { key, value, shared: false };
  },
  async delete(key){
    const existed = localStorage.getItem(key) !== null;
    localStorage.removeItem(key);
    return { key, deleted: existed, shared: false };
  },
  async list(prefix){
    const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
    return { keys, prefix, shared: false };
  }
};

const TRANSLATIONS = {
  tagline: {pt:'Instalações · Suportes · Adicionais', en:'Installations · Support · Add-ons', es:'Instalaciones · Soportes · Adicionales', fr:'Installations · Supports · Suppléments'},

function displayName(){
  const p = state.currentProfile || {};
  const first = (p.firstName||'').trim().split(/\s+/)[0] || '';
  const lastParts = (p.lastName||'').trim().split(/\s+/).filter(Boolean);
  const last = lastParts.length ? lastParts[lastParts.length - 1] : '';
  const full = (first + ' ' + last).trim();
  return full || state.currentEmail || '';
}
function avatarHTML(){
  const p = state.currentProfile || {};
  if(isSafePhoto(p.photo)) return `<img src="${p.photo}" alt="">`;
  const ini = ((p.firstName||'').charAt(0) + (p.lastName||'').charAt(0)).toUpperCase();
  return esc(ini) || '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="7" r="3.5"/><path d="M3.5 17c0.8-3.3 3.4-5 6.5-5s5.7 1.7 6.5 5"/></svg>';
}
function resizePhoto(file, size){
  size = size || 192;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const s = Math.min(img.width, img.height);
        const sx = (img.width - s) / 2, sy = (img.height - s) / 2;
        const c = document.createElement('canvas');
        c.width = c.height = size;
        c.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, size, size);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function handlePhotoSelected(file){
  if(!file) return;
  if(!/^image\//.test(file.type || '') || file.size > 10 * 1024 * 1024){
    showToast(t('errPhotoInvalid'));
    return;
  }
  try{
    const dataUrl = await resizePhoto(file);
    if(!isSafePhoto(dataUrl)){ showToast(t('errPhotoInvalid')); return; }
    state.currentProfile.photo = dataUrl;
    await saveProfile();
    render();
  }catch(e){ console.error('Erro ao carregar foto', e); }
}

}

function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function localeForLang(){
  return {pt:'pt-PT', en:'en-GB', es:'es-ES', fr:'fr-FR', ts:'ts-ZA'}[state.language] || 'pt-PT';
}
function eur(n){ return (n||0).toLocaleString(localeForLang(),{style:'currency',currency:'EUR'}); }
function fmtDate(iso){
  const [y,m,d] = iso.split('-');
  return new Date(y,m-1,d).toLocaleDateString(localeForLang(),{day:'2-digit',month:'short'});
}
function fmtDateFull(iso){
  const [y,m,d] = iso.split('-');
  return new Date(y,m-1,d).toLocaleDateString(localeForLang(),{weekday:'long',day:'2-digit',month:'long'});
}
function sanitizeUsername(u){ return u.trim().toLowerCase().replace(/[^a-z0-9_]/g,''); }
function titleCase(str){

let session = null; // {access_token, refresh_token, expires_at, user}

function loadStoredSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    session = raw ? JSON.parse(raw) : null;
  }catch(e){ session = null; }
}
function storeSession(s){
  session = s;
  try{
    if(s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
    else localStorage.removeItem(SESSION_KEY);
  }catch(e){}
}
function sessionFromResponse(d){
  return {
    access_token: d.access_token,
    refresh_token: d.refresh_token,
    expires_at: d.expires_at || (Math.floor(Date.now()/1000) + (d.expires_in || 3600)),
    user: d.user
  };
}
function ApiError(message, status, code){
  this.message = message; this.status = status; this.code = code;
}

async function sbRequest(path, opts){
  opts = opts || {};
  const headers = Object.assign({'apikey': SUPABASE_KEY, 'Content-Type': 'application/json'}, opts.headers || {});
  if(opts.token) headers['Authorization'] = 'Bearer ' + opts.token;
  let res;
  try{
    res = await fetch(SUPABASE_URL + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  }catch(e){
    throw new ApiError('network', 0, 'network');
  }
  let data = null;
  const text = await res.text();
  if(text){ try{ data = JSON.parse(text); }catch(e){ data = text; } }
  if(!res.ok){
    const msg = (data && (data.msg || data.message || data.error_description || data.error)) || ('HTTP ' + res.status);
    const code = (data && (data.error_code || data.code)) || '';
    throw new ApiError(String(msg), res.status, String(code));
  }
  return data;
}

async function refreshSession(){
  if(!session || !session.refresh_token) return false;
  try{
    const d = await sbRequest('/auth/v1/token?grant_type=refresh_token', {method:'POST', body:{refresh_token: session.refresh_token}});
    storeSession(sessionFromResponse(d));
    return true;
  }catch(e){
    if(e.status === 400 || e.status === 401 || e.status === 403) storeSession(null);
    return false;
  }
}
async function getToken(){
  if(!session) return null;
  const now = Math.floor(Date.now()/1000);
  if(session.expires_at - now < 60){
    await refreshSession();
    if(!session) return null;
    if(session.expires_at <= now) return null;
  }
  return session.access_token;
}
async function dbRequest(path, opts){
  const token = await getToken();
  if(!token) throw new ApiError('no session', 401, 'no_session');
  return sbRequest(path, Object.assign({token: token}, opts || {}));
}

/* ---------- VALIDACAO E LIMPEZA DE DADOS ---------- */
const ID_RE = /^[A-Za-z0-9_-]{1,40}$/;
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const PHOTO_RE = /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;
function cleanText(v, max){
  return String(v == null ? '' : v).replace(/[\u0000-\u001f\u007f]/g, ' ').trim().slice(0, max);
}
function cleanNum(v, min, max, dflt){
  const n = Number(v);
  if(!isFinite(n)) return dflt;
  return Math.min(max, Math.max(min, n));
}
function parseQty(v){
  const n = parseFloat(v);
  if(!isFinite(n) || n <= 0) return 1;
  return Math.min(Math.round(n * 100) / 100, 100000);
}
function parsePrice(v){
  const n = parseFloat(v);
  if(!isFinite(n) || n < 0) return 0;
  return Math.min(Math.round(n * 100) / 100, 1000000);
}
function isSafePhoto(p){
  return typeof p === 'string' && p.length < 200000 && PHOTO_RE.test(p);
}
function passwordOk(p){
  return typeof p === 'string' && p.length >= 8 && p.length <= 72 && /[A-Za-z]/.test(p) && /\d/.test(p);
}
function sanitizeProfile(p){
  p = (p && typeof p === 'object') ? p : {};
  return {
    firstName: cleanText(p.firstName, 60),
    lastName: cleanText(p.lastName, 60),
    phone: cleanText(p.phone, 30),
    photo: isSafePhoto(p.photo) ? p.photo : ''
  };
}
function sanitizeServices(arr){
  if(!Array.isArray(arr)) return [];
  const out = [], seen = Object.create(null);
  arr.slice(0, 500).forEach(sv=>{
    if(!sv || typeof sv !== 'object') return;
    const id = ID_RE.test(String(sv.id)) ? String(sv.id) : uid();
    if(seen[id]) return;
    seen[id] = true;
    out.push({
      id: id,
      name: cleanText(sv.name, 80) || '-',
      category: Object.prototype.hasOwnProperty.call(CATS, sv.category) ? sv.category : 'adicional',
      price: Math.round(cleanNum(sv.price, 0, 1000000, 0) * 100) / 100
    });
  });
  return out;
}
function sanitizeRecords(arr){
  if(!Array.isArray(arr)) return [];
  const out = [], seen = Object.create(null);
  arr.slice(0, 50000).forEach(r=>{
    if(!r || typeof r !== 'object') return;
    if(!DATE_RE.test(String(r.date))) return;
    const id = ID_RE.test(String(r.id)) ? String(r.id) : uid();
    if(seen[id]) return;
    seen[id] = true;
    const qty = cleanNum(r.qty, 0.01, 100000, 1);
    const unitPrice = cleanNum(r.unitPrice, 0, 1000000, 0);
    out.push({
      id: id,
      date: String(r.date),
      serviceId: ID_RE.test(String(r.serviceId)) ? String(r.serviceId) : '',
      serviceName: cleanText(r.serviceName, 80) || '-',
      category: Object.prototype.hasOwnProperty.call(CATS, r.category) ? r.category : 'adicional',
      unitPrice: unitPrice,
      qty: qty,
      total: Math.round(qty * unitPrice * 100) / 100,
      createdAt: cleanNum(r.createdAt, 0, 8.64e15, 0)
    });
  });
  return out;
}

/* ---------- AUTENTICACAO ---------- */
function mapAuthError(e){
  const m = ((e && e.message) || '').toLowerCase();
  const c = ((e && e.code) || '').toLowerCase();
  if(c === 'network' || m === 'network') return t('errNetwork');
  if(c === 'invalid_credentials' || m.indexOf('invalid login') !== -1) return t('errWrongCredentials');
  if(c === 'email_not_confirmed' || m.indexOf('not confirmed') !== -1) return t('errEmailNotConfirmed');
  if(c === 'user_already_exists' || m.indexOf('already registered') !== -1) return t('errEmailTaken');
  if(c === 'weak_password') return t('errPasswordLength');
  if((e && e.status === 429) || c.indexOf('rate_limit') !== -1) return t('errRateLimit');
  return t('errGeneric') + ' (' + String((e && e.message) || '?').slice(0, 200) + ')';
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escAttr(s){ return esc(s); }
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

async function startSession(){
  const u = (session && session.user) || {};

    storeSession(null);
    state.currentUser = null;
    state.currentEmail = '';
    state.authBusy = false;
    state.authError = mapAuthError(e);
    render();
    return false;
  }
  state.authBusy = false;

  state.authInfo = '';
  state.loaded = true;

}

async function handleRegister(password, confirm, firstName, lastName, email, phone){
  state.authError = ''; state.authInfo = '';
  email = (email || '').trim().toLowerCase();
  state.authDraft = {firstName: firstName, lastName: lastName, email: email, phone: phone};
  if(!firstName.trim() || !lastName.trim() || !email || !phone.trim() || !password){
    state.authError = t('errRequiredFields'); render(); return;
  }
  if(!EMAIL_RE.test(email)){ state.authError = t('errEmailInvalid'); render(); return; }
  if(phone.replace(/\D/g,'').length < 6){ state.authError = t('errPhoneInvalid'); render(); return; }
  if(!passwordOk(password)){ state.authError = t('errPasswordLength'); render(); return; }
  if(password !== confirm){ state.authError = t('errPasswordMismatch'); render(); return; }

  state.authBusy = true; render();
  try{
    const d = await sbRequest('/auth/v1/signup?redirect_to=' + encodeURIComponent(SITE_URL), {
      method: 'POST',
      body: {email: email, password: password, data: {first_name: firstName.trim(), last_name: lastName.trim(), phone: phone.trim()}}
    });
    if(d && d.access_token){
      storeSession(sessionFromResponse(d));
      await startSession();
    }else{
      state.authBusy = false;
      state.authMode = 'login';
      state.authInfo = t('confirmEmailMsg');
      render();
    }
  }catch(e){
    state.authBusy = false;
    state.authError = mapAuthError(e);
    render();
  }
}

  state.authBusy = true; render();

    const d = await sbRequest('/auth/v1/token?grant_type=password', {method:'POST', body:{email: email, password: password}});
    storeSession(sessionFromResponse(d));

}

      <main class="sheet" id="app">${state.loaded ? '' : '<div class="loading">…</div>'}</main>
    </div>
    </div>
  `;
  renderTabs();
  renderApp();

  if(menuBtn) menuBtn.onclick = async ()=>{
    if(window.matchMedia('(max-width:640px)').matches){
      document.body.classList.toggle('menu-open');

      const collapsed = document.body.classList.toggle('sidebar-collapsed');
      try{ await window.storage.set('ftth_sidebar_collapsed', collapsed ? '1' : '0', false); }catch(e){}
    }
  };
  const avatarBtn = document.getElementById('avatar-btn');
  const photoInput = document.getElementById('photo-input');
  if(avatarBtn && photoInput){
    avatarBtn.onclick = ()=> photoInput.click();

  }

function attachAuthHandlers(){
  document.getElementById('theme-toggle-btn').onclick = toggleTheme;

  if(state.authMode === 'recover'){
    const backBtn = document.getElementById('recover-back');
    if(backBtn) backBtn.onclick = ()=>{
      state.authMode = 'login';
      resetRecoverState();
      render();
    };

    if(state.recoverStep === 'email'){
      const sendBtn = document.getElementById('recover-send-btn');
      const emailEl = document.getElementById('recover-email');
      if(sendBtn && emailEl){
        sendBtn.onclick = ()=> handleRecoverSend(emailEl.value);
        emailEl.addEventListener('keydown', e=>{ if(e.key==='Enter') sendBtn.click(); });
      }
    }

    if(state.recoverStep === 'reset'){
      const showRecPass = document.getElementById('recover-show-pass');
      if(showRecPass) showRecPass.onchange = (e)=>{
        const type = e.target.checked ? 'text' : 'password';
        ['recover-newpass','recover-newpass2'].forEach(id=>{
          const el = document.getElementById(id);
          if(el) el.type = type;
        });
      };
      const resetBtn = document.getElementById('recover-reset-btn');
      if(resetBtn) resetBtn.onclick = ()=>{
        const np = document.getElementById('recover-newpass').value;
        const np2 = document.getElementById('recover-newpass2').value;
        handleRecoverReset(np, np2);
      };
    }
    return;
  }

  const showPassToggle = document.getElementById('show-pass-toggle');
  if(showPassToggle) showPassToggle.onchange = (e)=>{
    const type = e.target.checked ? 'text' : 'password';
    const p1 = document.getElementById('auth-pass');
    const p2 = document.getElementById('auth-pass2');
    if(p1) p1.type = type;
    if(p2) p2.type = type;
  };
  document.getElementById('auth-toggle').onclick = ()=>{
    state.authMode = state.authMode === 'login' ? 'register' : 'login';
    state.authError = '';
    state.authInfo = '';
    render();
  };
  const forgotLink = document.getElementById('forgot-pass-link');
  if(forgotLink) forgotLink.onclick = ()=>{
    const emailEl = document.getElementById('auth-email');
    if(emailEl) state.authDraft = Object.assign({}, state.authDraft, {email: emailEl.value});
    state.authMode = 'recover';
    resetRecoverState();
    state.authError = '';
    state.authInfo = '';
    render();
  };
  document.getElementById('auth-submit').onclick = ()=>{
    const email = document.getElementById('auth-email').value;
    const pass = document.getElementById('auth-pass').value;
    if(state.authMode === 'login'){
      handleLogin(email, pass);
    }else{
      const pass2 = document.getElementById('auth-pass2').value;
      const firstName = document.getElementById('auth-firstname').value;
      const lastName = document.getElementById('auth-lastname').value;
      const phone = document.getElementById('auth-phone').value;
      handleRegister(pass, pass2, firstName, lastName, email, phone);
    }
  };
  document.getElementById('auth-pass').addEventListener('keydown', e=>{
    if(e.key==='Enter') document.getElementById('auth-submit').click();
  });
}

const DOUBLE_MULT = 2; // domingos
function isSundayISO(iso){
  const p = String(iso || '').split('-').map(Number);
  return new Date(p[0], p[1] - 1, p[2]).getDay() === 0;
}
function dayMult(iso){ return isSundayISO(iso) ? DOUBLE_MULT : 1; }
function unitRate(r){ return Math.round(r.unitPrice * dayMult(r.date) * 100) / 100; }
function priceOn(price, iso){ return Math.round(price * dayMult(iso) * 100) / 100; }
function optLabel(sv, iso){
  return esc(sv.name) + ' — ' + eur(priceOn(sv.price, iso)) + (dayMult(iso) > 1 ? ' (×' + DOUBLE_MULT + ')' : '');
}
function recTotal(r){ return Math.round(r.qty * r.unitPrice * dayMult(r.date) * 100) / 100; }
function sundayBlock(date){
  return isSundayISO(date) ? `<div class="double-note">${esc(t('sundayNote'))}</div>` : '';
}
function dayBadge(iso){
  return isSundayISO(iso) ? ` <span class="badge adicional">${esc(t('badgeSunday'))}</span>` : '';
}
function recordsForDate(date){
  return state.records.filter(r=>r.date===date);
}
function dayTotal(date){
  return recordsForDate(date).reduce((s,r)=>s+recTotal(r),0);
}
function aggregateByService(records){
  const map = Object.create(null);
  records.forEach(r=>{
    if(!map[r.serviceId]) map[r.serviceId] = {name:r.serviceName, category:r.category, qty:0, total:0};
    map[r.serviceId].qty += r.qty;
    map[r.serviceId].total += recTotal(r);
  });
  return Object.values(map).sort((a,b)=>b.total-a.total);
}

/* ---------- SEMANAS E TIPOS DE DIA (normal / domingo) ---------- */
function pad2(n){ return String(n).padStart(2, '0'); }
function isoOf(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseISO(iso){ const p = String(iso).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDaysISO(iso, n){ const d = parseISO(iso); d.setDate(d.getDate() + n); return isoOf(d); }
function weekStartISO(iso){ const d = parseISO(iso); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoOf(d); } // segunda-feira
function weekDays(start){ const out = []; for(let i = 0; i < 7; i++) out.push(addDaysISO(start, i)); return out; }
function isoWeekNum(iso){
  const d = parseISO(iso);
  const t0 = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t0.getUTCDay() || 7;
  t0.setUTCDate(t0.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t0.getUTCFullYear(), 0, 1));
  return Math.ceil(((t0 - y0) / 86400000 + 1) / 7);
}
function dayKind(iso){
  return isSundayISO(iso) ? 'domingo' : 'normal';
}
function kindTotals(recs){
  const out = {};
  ['normal', 'domingo'].forEach(k=>{ out[k] = {total: 0, base: 0, days: new Set()}; });
  recs.forEach(r=>{
    const o = out[dayKind(r.date)];
    o.total += recTotal(r);
    o.base += r.qty * r.unitPrice;
    o.days.add(r.date);
  });
  Object.keys(out).forEach(k=>{
    out[k].total = Math.round(out[k].total * 100) / 100;
    out[k].extra = Math.round((out[k].total - out[k].base) * 100) / 100;
    out[k].n = out[k].days.size;
  });
  return out;
}
function kindCards(k){
  const defs = [['normal', 'kindNormal', 'var(--ink)'], ['domingo', 'kindSunday', 'var(--adicional)']];
  return '<div class="breakdown">' + defs.map(d=>{
    const o = k[d[0]];
    const sub = o.n + ' ' + (o.n === 1 ? t('dayOne') : t('dayMany')) + (d[0] !== 'normal' && o.extra > 0 ? ' · +' + eur(o.extra) + ' ' + t('extraDouble') : '');
    return `<div class="bd-card"><div class="k">${esc(t(d[1]))}</div><div class="v" style="color:${d[2]}">${eur(o.total)}</div><div class="s">${esc(sub)}</div></div>`;
  }).join('') + '</div>';
}
function specialDaysTable(recs){
  const map = Object.create(null);
  recs.forEach(r=>{
    const k = dayKind(r.date);
    if(k === 'normal') return;
    const m = map[r.date] || (map[r.date] = {date: r.date, kind: k, total: 0, qty: 0});
    m.total += recTotal(r);
    m.qty += r.qty;
  });
  const rows = Object.values(map).sort((a, b)=> a.date.localeCompare(b.date));
  if(!rows.length) return `<p class="empty">${esc(t('noSpecialDays'))}</p>`;
  const sum = rows.reduce((a, r)=> a + r.total, 0);
  return `<div class="table-scroll"><table>
    <thead><tr><th>${t('thDay')}</th><th>${t('thType')}</th><th class="num">${t('thQtyTotal')}</th><th class="num">${t('thValueTotal')}</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${esc(fmtDateFull(r.date))}</td><td><span class="badge adicional">${esc(t('badgeSunday'))}</span></td><td class="num">${r.qty}</td><td class="num">${eur(r.total)}</td></tr>`).join('')}
    <tr class="total-row"><td colspan="3">${esc(t('totalSpecial'))}</td><td class="num">${eur(sum)}</td></tr></tbody>
  </table></div>`;
}

/* --- recibos (foto) --- */
function resizeReceipt(file, maxSide){
  maxSide = maxSide || 1280;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const sc = Math.min(1, maxSide / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const g = c.getContext('2d');
        g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
        g.drawImage(img, 0, 0, w, h);
        let q = 0.75, out = c.toDataURL('image/jpeg', q);
        while(out.length > 700000 && q > 0.35){ q -= 0.1; out = c.toDataURL('image/jpeg', q); }
        resolve(out);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function processReceiptFile(file){
  if(!/^image\//.test(file.type || '') || file.size > 15 * 1024 * 1024){ showToast(t('errReceiptInvalid')); return null; }
  try{
    const d = await resizeReceipt(file, 1280);
    if(!isSafeReceipt(d)){ showToast(t('errReceiptInvalid')); return null; }
    return d;
  }catch(e){ showToast(t('errReceiptInvalid')); return null; }
}
async function addExpenseFromForm(){
  const cat = document.getElementById('exp-cat').value;
  const amount = parseAmount(document.getElementById('exp-amount').value);
  const note = cleanText(document.getElementById('exp-note').value, 80);
  const fileEl = document.getElementById('exp-file');
  const file = fileEl && fileEl.files && fileEl.files[0];
  if(!Object.prototype.hasOwnProperty.call(EXP_CATS, cat) || !DATE_RE.test(String(state.expenseDate))) return;
  if(!(amount > 0)){ showToast(t('errAmount')); return; }
  if(state.expenses.length >= 20000) return;
  let receipt = null;
  if(file){ receipt = await processReceiptFile(file); if(!receipt) return; }
  const exp = {id: uid(), date: state.expenseDate, category: cat, amount: amount, note: note, hasReceipt: !!receipt, createdAt: Date.now()};
  state.expenses.push(exp);
  if(!(await saveExpenses())){ state.expenses.pop(); renderApp(); return; }
  if(receipt){
    try{ await saveReceipt(exp.id, receipt); }
    catch(e){
      console.error('Erro ao guardar recibo', e);
      exp.hasReceipt = false;
      await saveExpenses();
      showToast(t('errReceiptSave'));
      renderApp();
      return;
    }
  }
  renderApp();
  showToast(t('toastExpenseAdded'));
}
async function attachReceipt(id, file){
  const exp = state.expenses.find(e=> e.id === id);
  if(!exp) return;
  const receipt = await processReceiptFile(file);
  if(!receipt) return;
  try{ await saveReceipt(id, receipt); }
  catch(e){ console.error(e); showToast(t('errReceiptSave')); return; }
  exp.hasReceipt = true;
  await saveExpenses();
  renderApp();
  showToast(t('toastReceiptSaved'));
}
async function deleteExpense(id){
  const exp = state.expenses.find(e=> e.id === id);
  if(!exp) return;
  const ok = await showConfirm(t('confirmDeleteExpense'));
  if(!ok) return;
  state.expenses = state.expenses.filter(e=> e.id !== id);
  await saveExpenses();
  if(exp.hasReceipt){ try{ await deleteReceipt(id); }catch(e){ console.error(e); } }
  renderApp();
}
async function viewReceipt(id){
  if(!ID_RE.test(String(id))) return;
  let photo = null;
  try{ photo = await fetchReceipt(id); }
  catch(e){ showToast(mapAuthError(e)); return; }
  if(!photo){ showToast(t('errReceiptLoad')); return; }
  const ov = document.createElement('div');
  ov.className = 'confirm-overlay';
  ov.innerHTML = `<div class="receipt-box"><img alt="" src="${photo}"><div class="confirm-actions"><button class="btn secondary" id="receipt-close">${esc(t('closeBtn'))}</button></div></div>`;
  document.body.appendChild(ov);
  const close = ()=> ov.remove();
  ov.querySelector('#receipt-close').onclick = close;
  ov.onclick = (e)=>{ if(e.target === ov) close(); };
}

/* ---------- GERADOR DE PDF (sem bibliotecas) ---------- */
const HELV = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
function textW(str, size){
  let w = 0;
  for(const ch of String(str)){
    const base = ch.normalize('NFD').charAt(0);
    const c = base.charCodeAt(0);
    w += (c >= 32 && c <= 126) ? HELV[c - 32] : 556;
  }
  return w * size / 1000;
}
function fitText(str, size, maxW){
  str = String(str);
  if(textW(str, size) <= maxW) return str;
  while(str.length > 1 && textW(str + '...', size) > maxW) str = str.slice(0, -1);
  return str + '...';
}
function pdfEnc(str){
  const map = {'€':0x80, '‘':0x91, '’':0x92, '“':0x93, '”':0x94, '•':0x95, '–':0x96, '—':0x97, '…':0x85};
  let out = '';
  for(const ch of String(str).replace(/[\r\n\t]+/g, ' ')){
    const c = ch.codePointAt(0);
    if(map[ch] !== undefined) out += String.fromCharCode(map[ch]);
    else if(c === 0xa0 || c === 0x202f || c === 0x2009) out += ' ';
    else if(c >= 32 && c < 256 && !(c >= 0x7f && c <= 0x9f)) out += String.fromCharCode(c);
    else out += '?';
  }
  return out;
}
function pdfEsc(bin){ return bin.replace(/([\\()])/g, '\\$1'); }
function strToBytes(s){
  const u = new Uint8Array(s.length);
  for(let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i) & 255;
  return u;
}
function dataUrlBytes(d){
  const b = atob(d.slice(d.indexOf(',') + 1));
  const u = new Uint8Array(b.length);
  for(let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return u;
}
function jpegInfo(bytes){
  if(!bytes || bytes[0] !== 0xFF || bytes[1] !== 0xD8) return null;
  let i = 2;
  while(i + 9 < bytes.length){
    if(bytes[i] !== 0xFF){ i++; continue; }
    const m = bytes[i + 1];
    if(m === 0xD8 || m === 0x01 || (m >= 0xD0 && m <= 0xD7)){ i += 2; continue; }
    const len = (bytes[i + 2] << 8) | bytes[i + 3];
    if(m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC){
      return {h: (bytes[i + 5] << 8) | bytes[i + 6], w: (bytes[i + 7] << 8) | bytes[i + 8], comps: bytes[i + 9]};
    }
    i += 2 + len;
  }
  return null;
}
function PdfPage(){ this.ops = []; this.images = []; }
PdfPage.prototype.text = function(x, y, size, str, bold){
  this.ops.push('BT /' + (bold ? 'F2' : 'F1') + ' ' + size + ' Tf ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' Td (' + pdfEsc(pdfEnc(str)) + ') Tj ET');
};
PdfPage.prototype.line = function(x1, y1, x2, y2, w, gray){
  this.ops.push((gray === undefined ? 0 : gray) + ' G ' + (w || 0.5) + ' w ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' m ' + x2.toFixed(2) + ' ' + y2.toFixed(2) + ' l S');
};
PdfPage.prototype.image = function(name, jpeg, info, x, y, dw, dh){
  this.images.push({name: name, jpeg: jpeg, w: info.w, h: info.h, comps: info.comps});
  this.ops.push('q ' + dw.toFixed(2) + ' 0 0 ' + dh.toFixed(2) + ' ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' cm /' + name + ' Do Q');
};
function buildPdf(pages, title){
  const objs = [];
  const add = (parts)=>{ objs.push(parts); return objs.length; };
  add(null); add(null); // 1 = catalogo, 2 = paginas
  const fReg = add(['<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>']);
  const fBold = add(['<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>']);
  const kids = [];
  pages.forEach(pg=>{
    const refs = [];
    pg.images.forEach(im=>{
      const num = add(['<< /Type /XObject /Subtype /Image /Width ' + im.w + ' /Height ' + im.h + ' /ColorSpace ' + (im.comps === 1 ? '/DeviceGray' : '/DeviceRGB') + ' /BitsPerComponent 8 /Filter /DCTDecode /Length ' + im.jpeg.length + ' >>\nstream\n', im.jpeg, '\nendstream']);
      refs.push('/' + im.name + ' ' + num + ' 0 R');
    });
    const content = pg.ops.join('\n');
    const cnum = add(['<< /Length ' + content.length + ' >>\nstream\n', content, '\nendstream']);
    const pnum = add(['<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 ' + fReg + ' 0 R /F2 ' + fBold + ' 0 R >>' + (refs.length ? ' /XObject << ' + refs.join(' ') + ' >>' : '') + ' >> /Contents ' + cnum + ' 0 R >>']);
    kids.push(pnum + ' 0 R');
  });
  objs[0] = ['<< /Type /Catalog /Pages 2 0 R >>'];
  objs[1] = ['<< /Type /Pages /Kids [ ' + kids.join(' ') + ' ] /Count ' + kids.length + ' >>'];
  const info = add(['<< /Title (' + pdfEsc(pdfEnc(title)) + ') /Creator (Registo FTTH) /Producer (Registo FTTH) >>']);
  const chunks = [], offsets = [];
  let offset = 0;
  const push = (p)=>{ const u = typeof p === 'string' ? strToBytes(p) : p; chunks.push(u); offset += u.length; };
  push('%PDF-1.4\n%\u00e2\u00e3\u00cf\u00d3\n');
  objs.forEach((parts, i)=>{
    offsets.push(offset);
    push((i + 1) + ' 0 obj\n');
    parts.forEach(push);
    push('\nendobj\n');
  });
  const xref = offset;
  push('xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n');
  offsets.forEach(o=> push(String(o).padStart(10, '0') + ' 00000 n \n'));
  push('trailer\n<< /Size ' + (objs.length + 1) + ' /Root 1 0 R /Info ' + info + ' 0 R >>\nstartxref\n' + xref + '\n%%EOF');
  return new Blob(chunks, {type: 'application/pdf'});
}
function buildExpensePdf(cat, month, list, receipts, withReceipts){
  const W = 595.28, H = 841.89, M = 50, RX = W - M;
  const pages = [];
  const catName = expCatLabel(cat);
  const mp = month.split('-').map(Number);
  const monthLabel = new Date(mp[0], mp[1] - 1, 1).toLocaleDateString(localeForLang(), {month: 'long', year: 'numeric'});
  let pg = null, y = 0;
  const tableHeader = ()=>{
    pg.text(M, y, 9, t('pdfDate'), true);
    pg.text(M + 70, y, 9, t('pdfDesc'), true);
    pg.text(M + 370, y, 9, t('thReceipt'), true);
    const hv = t('pdfValue');
    pg.text(RX - textW(hv, 9), y, 9, hv, true);
    y -= 6; pg.line(M, y, RX, y, 0.8); y -= 14;
  };
  const newPage = (first, noTable)=>{
    pg = new PdfPage(); pages.push(pg); y = H - M;
    if(first){
      pg.text(M, y, 9, 'Registo FTTH', false); y -= 30;
      pg.text(M, y, 20, t('pdfTitle'), true); y -= 26;
      pg.text(M, y, 14, catName, true); y -= 28;
      [[t('pdfName'), displayFullName()], [t('pdfCategory'), catName], [t('pdfPeriod'), monthLabel], [t('pdfIssued'), fmtIsoPt(todayISO())]].forEach(r=>{
        pg.text(M, y, 10, r[0] + ':', true);
        pg.text(M + 90, y, 10, fitText(r[1], 10, RX - M - 90), false);
        y -= 16;
      });
      y -= 12;
    }else{
      pg.text(M, y, 11, fitText(t('pdfTitle') + ' - ' + catName + ' - ' + monthLabel, 11, RX - M), true); y -= 24;
    }
    if(!noTable) tableHeader();
  };
  newPage(true, false);
  let total = 0;
  list.forEach(e=>{
    if(y < M + 60) newPage(false, false);
    pg.text(M, y, 10, fmtIsoPt(e.date), false);
    pg.text(M + 70, y, 10, fitText(e.note || '-', 10, 285), false);
    pg.text(M + 370, y, 10, e.hasReceipt ? t('yesWord') : t('noWord'), false);
    const v = eur(e.amount);
    pg.text(RX - textW(v, 10), y, 10, v, false);
    pg.line(M, y - 5, RX, y - 5, 0.3, 0.8);
    y -= 18;
    total += e.amount;
  });
  if(y < M + 110) newPage(false, true);
  y -= 4;
  pg.line(M, y + 10, RX, y + 10, 1);
  const tv = eur(Math.round(total * 100) / 100);
  pg.text(M + 70, y - 6, 11, t('pdfTotal') + ' (' + list.length + ')', true);
  pg.text(RX - textW(tv, 11) * 1.06, y - 6, 11, tv, true);
  y -= 70;
  pg.line(M, y, M + 230, y, 0.6);
  pg.text(M, y - 12, 9, t('pdfSignature'), false);
  pg.line(M + 280, y, RX, y, 0.6);
  pg.text(M + 280, y - 12, 9, t('pdfDate'), false);

  if(withReceipts){
    list.forEach(e=>{
      const d = receipts[e.id];
      if(!d) return;
      const jpeg = dataUrlBytes(d), info = jpegInfo(jpeg);
      if(!info || !info.w || !info.h) return;
      newPage(false, true);
      pg.text(M, y, 11, fmtIsoPt(e.date) + '  -  ' + catName + '  -  ' + eur(e.amount), true); y -= 16;
      if(e.note) { pg.text(M, y, 10, fitText(e.note, 10, RX - M), false); y -= 14; }
      y -= 6;
      const maxW = RX - M, maxH = y - M - 20;
      const sc = Math.min(maxW / info.w, maxH / info.h, 3);
      const dw = info.w * sc, dh = info.h * sc;
      pg.image('Im1', jpeg, info, M + (maxW - dw) / 2, y - dh, dw, dh);
    });
  }
  pages.forEach((p, i)=>{
    const f = 'Registo FTTH  -  ' + (i + 1) + '/' + pages.length;
    p.text(W / 2 - textW(f, 8) / 2, 28, 8, f, false);
  });
  return buildPdf(pages, t('pdfTitle') + ' - ' + catName + ' - ' + monthLabel);
}
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 60000);
}
async function generateExpensePdf(cat, btn){
  if(!Object.prototype.hasOwnProperty.call(EXP_CATS, cat)) return;
  const month = state.expenseMonth;
  const list = state.expenses.filter(e=> e.category === cat && e.date.startsWith(month)).sort((a, b)=> a.date.localeCompare(b.date) || a.createdAt - b.createdAt);
  if(!list.length){ showToast(t('pdfNone')); return; }
  const withReceipts = state.pdfWithReceipts;
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = t('pdfWorking');
  try{
    let receipts = {};
    if(withReceipts){
      const ids = list.filter(e=> e.hasReceipt).map(e=> e.id);
      if(ids.length) receipts = await fetchReceipts(ids);
    }
    downloadBlob(buildExpensePdf(cat, month, list, receipts, withReceipts), 'comprovativo-' + cat + '-' + month + '.pdf');
  }catch(e){ console.error(e); showToast(mapAuthError(e)); }
  btn.disabled = false; btn.textContent = label;
}

      });
    };

    const changePassBtn = document.getElementById('change-pass-btn');
    if(changePassBtn) changePassBtn.onclick = async ()=>{
      state.settingsPasswordError = '';
      state.settingsPasswordSuccess = '';
      const curPass = document.getElementById('cur-pass').value;
      const newPass = document.getElementById('new-pass').value;
      const newPass2 = document.getElementById('new-pass2').value;

      if(!passwordOk(newPass)){ state.settingsPasswordError = t('errPasswordLength'); renderApp(); return; }
      if(newPass !== newPass2){ state.settingsPasswordError = t('errPasswordMismatch'); renderApp(); return; }

      state.settingsPasswordBusy = true; renderApp();
      try{
        await sbRequest('/auth/v1/token?grant_type=password', {method:'POST', body:{email: state.currentEmail, password: curPass}});
      }catch(e){
        state.settingsPasswordBusy = false;
        state.settingsPasswordError = (e.status === 400 || e.code === 'invalid_credentials') ? t('errCurrentPasswordWrong') : mapAuthError(e);
        renderApp(); return;
      }
      try{
        const token = await getToken();
        await sbRequest('/auth/v1/user', {method:'PUT', token: token, body:{password: newPass}});
      }catch(e){
        state.settingsPasswordBusy = false;
        state.settingsPasswordError = mapAuthError(e);
        renderApp(); return;
      }
      state.settingsPasswordBusy = false;
      renderApp();
      showToast(t('toastPasswordChanged'));
    };
  }
}

  const hash = window.location.hash || '';
  let confirmed = null;
  if(hash.indexOf('access_token=') !== -1 && hash.indexOf('type=recovery') !== -1){
    const params = new URLSearchParams(hash.replace(/^#/, ''));
    state.recoverToken = params.get('access_token');
    state.authMode = 'recover';
    state.recoverStep = 'reset';
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }else if(hash.indexOf('access_token=') !== -1 && /type=(signup|invite|magiclink|email_change)/.test(hash)){
    const params = new URLSearchParams(hash.replace(/^#/, ''));
    const at = params.get('access_token'), rt = params.get('refresh_token');
    const ei = parseInt(params.get('expires_in') || '3600', 10);
    if(at && rt) confirmed = {at: at, rt: rt, ei: (ei > 0 && ei < 86400 * 7) ? ei : 3600};
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }else if(hash.indexOf('error_code=') !== -1){
    state.authMode = 'login';
    state.authError = t('errLinkExpired');
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }

  loadStoredSession();
  if(confirmed){
    state.booting = true;
    render();
    try{
      const user = await sbRequest('/auth/v1/user', {token: confirmed.at});
      storeSession({access_token: confirmed.at, refresh_token: confirmed.rt, expires_at: Math.floor(Date.now()/1000) + confirmed.ei, user: user});
      state.booting = false;
      if(await startSession()) showToast(t('emailConfirmedMsg'));
    }catch(e){
      state.booting = false;
      state.authInfo = t('emailConfirmedLoginMsg');
      render();
    }
  }else{
    state.booting = !!(session && !state.recoverToken);
    render();
    if(state.booting){
      const tok = await getToken();
      state.booting = false;
      if(tok){ await startSession(); } else { render(); }
    }
  }
})();
</script>
</body>
</html>
