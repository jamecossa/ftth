name: Build APK

on:
  workflow_dispatch:

# permissoes minimas para o token do GitHub
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar pasta www
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; fi

      - name: Instalar Capacitor
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Endurecer a app Android (sem copias de seguranca da sessao)
        run: |
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
          grep -n "allowBackup" android/app/src/main/AndroidManifest.xml

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: registo-ftth-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
